<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Quarter Athletics Club — Coming Soon</title>
  <meta name="description" content="The Quarter Athletics Club — a human-coaching-led performance club for the everyday athlete. Coming soon. Join the waitlist.">
  <meta name="theme-color" content="#f2eee4">
  <link rel="canonical" href="https://quarterathleticsclub.com/">

  <!-- Favicons -->
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Quarter Athletics Club">
  <meta property="og:title" content="The Quarter Athletics Club — Coming Soon">
  <meta property="og:description" content="A human-coaching-led performance club for the everyday athlete. Coming soon — join the waitlist.">
  <meta property="og:url" content="https://quarterathleticsclub.com/">
  <meta property="og:image" content="https://quarterathleticsclub.com/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Quarter Athletics Club — Coming Soon. For the everyday athlete.">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The Quarter Athletics Club — Coming Soon">
  <meta name="twitter:description" content="A human-coaching-led performance club for the everyday athlete. Coming soon — join the waitlist.">
  <meta name="twitter:image" content="https://quarterathleticsclub.com/assets/og-image.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prata&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=20">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <span class="label">QTR&nbsp;/&nbsp;MMXXVII</span>
    </header>

    <main class="hero">
      <div class="hero-stage">
        <p class="wordmark-the">THE</p>
        <figure class="hero-media">
          <img class="hero-photo" src="Images/35.jpg" alt="">
          <img class="hero-photo" src="Images/36.jpg" alt="">
          <img class="hero-photo" src="Images/37.jpg" alt="">
          <img class="hero-photo" src="Images/38.jpg" alt="">
          <img class="hero-photo" src="Images/39.jpg" alt="">
          <span class="wordmark-clip" aria-hidden="true">QUARTER</span>
        </figure>
        <h1 class="wordmark">QUARTER</h1>
        <p class="wordmark-club">Athletics&nbsp;Club</p>
      </div>
      <p class="tagline">For The Everyday Athlete.</p>
      <button class="cta" type="button" data-waitlist-open>Register&nbsp;Interest</button>
    </main>

    <footer class="footer">
      <span class="label">© The Quarter Athletics Club</span>
    </footer>
  </div>

  <!-- Waitlist modal — opened by REGISTER INTEREST -->
  <div class="modal" id="waitlist" hidden>
    <div class="modal__scrim" data-waitlist-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true"
         aria-labelledby="wl-title" aria-describedby="wl-desc">
      <button class="modal__close" type="button" aria-label="Close" data-waitlist-close>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M5 5 L19 19 M19 5 L5 19" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round"></path>
        </svg>
      </button>

      <!-- Form view -->
      <div class="modal__view" data-view="form">
        <p class="modal__eyebrow label">The Quarter Athletics Club</p>
        <h2 class="modal__title" id="wl-title">Register Interest</h2>
        <p class="modal__desc" id="wl-desc">Join the waitlist and we’ll let you know the moment the doors open.</p>

        <form class="wl-form" novalidate>
          <div class="wl-names">
            <span class="wl-field">
              <label class="visually-hidden" for="wl-fname">First name</label>
              <input class="wl-input" id="wl-fname" name="FNAME" type="text"
                     autocomplete="given-name" placeholder="First name"
                     aria-describedby="wl-msg" required>
            </span>
            <span class="wl-field">
              <label class="visually-hidden" for="wl-lname">Last name</label>
              <input class="wl-input" id="wl-lname" name="LNAME" type="text"
                     autocomplete="family-name" placeholder="Last name"
                     aria-describedby="wl-msg" required>
            </span>
          </div>
          <label class="visually-hidden" for="wl-email">Email address</label>
          <input class="wl-input" id="wl-email" name="EMAIL" type="email"
                 inputmode="email" autocomplete="email" autocapitalize="off"
                 spellcheck="false" placeholder="you@email.com"
                 aria-describedby="wl-msg" required>
          <button class="cta wl-submit" type="submit">
            <span class="wl-submit__label">Join the Waitlist</span>
          </button>
          <p class="wl-msg" id="wl-msg" role="alert"></p>
        </form>
      </div>

      <!-- Success view -->
      <div class="modal__view" data-view="success" hidden>
        <span class="wl-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" focusable="false">
            <path d="M4 12.5 L10 18.5 L20 6.5" fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </span>
        <h2 class="modal__title" id="wl-success-title" tabindex="-1" data-success-focus>You’re on the list.</h2>
        <p class="modal__desc" id="wl-success-desc" data-success-desc>Thanks — we’ll be in touch as launch nears.</p>
        <button class="cta wl-done" type="button" data-waitlist-close>
          <span>Close</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Receives the Mailchimp POST response so the visitor stays on this page -->
  <iframe name="wl-sink" class="wl-sink" tabindex="-1" aria-hidden="true" title="Waitlist submission"></iframe>

  <script src="script.js?v=9"></script>
</body>
</html>
